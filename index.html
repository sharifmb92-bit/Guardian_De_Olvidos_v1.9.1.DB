<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardián de Olvidos v1.9.1</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <meta name="theme-color" content="#374151">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandGray: '#374151',
                        brandGrayDark: '#1f2937',
                        brandGreen: '#22c55e',
                        brandOrange: '#f97316'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">
    <!-- medbasha -->
    <div class="max-w-md w-full bg-brandGrayDark rounded-2xl p-6 shadow-2xl border border-brandGray text-center">
        <div class="w-20 h-20 mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="w-full h-full drop-shadow-lg">
                <rect width="512" height="512" rx="100" fill="#1f2937"/>
                <circle cx="256" cy="256" r="180" fill="none" stroke="#22c55e" stroke-width="16" stroke-dasharray="12 12"/>
                <rect x="206" y="76" width="100" height="360" rx="20" fill="#374151"/>
                <circle cx="256" cy="256" r="120" fill="#374151" stroke="#22c55e" stroke-width="12"/>
                <circle cx="256" cy="256" r="90" fill="#111827"/>
                <path d="M256 190 v66 h50" fill="none" stroke="#f97316" stroke-width="12" stroke-linecap="round"/>
                <circle cx="256" cy="256" r="12" fill="#f97316"/>
            </svg>
        </div>
        
        <h1 class="text-2xl font-bold mb-1 text-brandGreen">Guardián de Olvidos v1.9.1</h1>
        <p class="text-gray-400 text-sm mb-6">Radar Multi-Dispositivo Bluetooth</p>

        <!-- Panel de control principal -->
        <div class="space-y-3 mb-6">
            <button id="addDeviceBtn" class="w-full bg-brandGreen hover:bg-green-600 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-lg flex items-center justify-center gap-2">
                <span>➕ Añadir Dispositivo Bluetooth</span>
            </button>
        </div>

        <!-- Lista de dispositivos vigilados -->
        <div class="mb-6 text-left">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Dispositivos Vigilados</span>
                <span id="deviceCount" class="text-xs bg-gray-800 px-2 py-0.5 rounded-full text-brandGreen font-bold">0 activos</span>
            </div>
            <div id="deviceList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <div id="emptyListMsg" class="p-4 rounded-xl bg-gray-900 border border-brandGray text-center text-xs text-gray-500">
                    No hay dispositivos añadidos. Pulsa arriba para vincular uno.
                </div>
            </div>
        </div>

        <div id="alarmZone" class="mb-6 p-4 rounded-xl bg-gray-900 border border-brandOrange hidden">
            <p class="text-brandOrange font-bold animate-bounce text-sm">⚠️ ¡ALERTA: UN DISPOSITIVO ESTÁ FUERA DE RANGO!</p>
        </div>

        <!-- Terminal de registro -->
        <div class="text-left">
            <span class="text-xs font-mono text-gray-400">Diagnóstico del Radar:</span>
            <div id="logTerminal" class="h-28 overflow-y-auto bg-black/70 border border-brandGray rounded-lg p-2 text-xs font-mono text-gray-300 mt-1 space-y-1">
                <div>[Sistema] Guardián de Olvidos 1.9.1 listo.</div>
            </div>
        </div>
    </div>

    <audio id="silentAudio" loop>
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" type="audio/wav">
    </audio>

    <script type="module">
        // medbasha - Guardián de Olvidos v1.9.1
        import { Geolocation } from '@capacitor/geolocation';
        import { Camera, CameraResultType, CameraSource } from '@capacitor/camera';
        import { LocalNotifications } from '@capacitor/local-notifications';
        import { Filesystem, Directory, Encoding } from '@capacitor/filesystem';
        import { Haptics, ImpactStyle } from '@capacitor/haptics';
        import { Motion } from '@capacitor/motion';
        import { BleClient } from '@capacitor-community/bluetooth-le';

        window.CapacitorNative = {
            async initPermissions() {
                try {
                    await Geolocation.requestPermissions().catch(() => {});
                    await Camera.requestPermissions().catch(() => {});
                    await LocalNotifications.requestPermissions().catch(() => {});
                    await Filesystem.requestPermissions().catch(() => {});
                    await BleClient.initialize().catch(() => {});
                } catch (err) {}
            },
            async sendLocalNotification(title, body) {
                try {
                    await LocalNotifications.schedule({
                        notifications: [{ title, body, id: Date.now(), schedule: { at: new Date(Date.now() + 1000) } }]
                    });
                } catch (err) {}
            },
            async triggerHapticFeedback() {
                try {
                    await Haptics.impact({ style: ImpactStyle.Heavy });
                } catch (err) {}
            }
        };

        // medbasha - Módulo IndexedDB
        const DB_NAME = 'GuardianOlvidosDB_v191';
        const DB_VERSION = 1;
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const dbRef = e.target.result;
                    if (!dbRef.objectStoreNames.contains('devices')) {
                        dbRef.createObjectStore('devices', { keyPath: 'id' });
                    }
                    if (!dbRef.objectStoreNames.contains('logs')) {
                        dbRef.createObjectStore('logs', { keyPath: 'timestamp' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveDeviceToDB(deviceData) {
            if (!db) await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('devices', 'readwrite');
                tx.objectStore('devices').put(deviceData);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        }

        async function removeDeviceFromDB(deviceId) {
            if (!db) return;
            const tx = db.transaction('devices', 'readwrite');
            tx.objectStore('devices').delete(deviceId);
        }

        async function saveLogData(msg) {
            if (!db) return;
            const tx = db.transaction('logs', 'readwrite');
            tx.objectStore('logs').put({ timestamp: Date.now(), timeStr: new Date().toLocaleTimeString(), message: msg });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.error(err));
            });
        }

        const addDeviceBtn = document.getElementById('addDeviceBtn');
        const deviceList = document.getElementById('deviceList');
        const emptyListMsg = document.getElementById('emptyListMsg');
        const deviceCount = document.getElementById('deviceCount');
        const alarmZone = document.getElementById('alarmZone');
        const silentAudio = document.getElementById('silentAudio');
        const logTerminal = document.getElementById('logTerminal');

        let trackedDevices = [];
        let monitorInterval = null;
        let wakeLock = null;

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.textContent = `[${time}] ${msg}`;
            logTerminal.appendChild(entry);
            logTerminal.scrollTop = logTerminal.scrollHeight;
            saveLogData(msg).catch(() => {});
        }

        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    addLog("Prioridad de pantalla activa.");
                }
            } catch (err) {
                addLog("Prioridad activa mediante audio.");
            }
        }

        window.addEventListener('load', async () => {
            await initDB();
            if (window.CapacitorNative) {
                window.CapacitorNative.initPermissions();
            }
            comprobarMemoriaDispositivos();
            iniciarMonitoreoGlobal();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                addLog("Revisando conexiones de la lista...");
                trackedDevices.forEach(item => {
                    if (item.device && (!item.device.gatt || !item.device.gatt.connected)) {
                        conectarGATT(item);
                    }
                });
            }
        });

        async function comprobarMemoriaDispositivos() {
            if ('bluetooth' in navigator && 'getDevices' in navigator.bluetooth) {
                try {
                    const knownDevices = await navigator.bluetooth.getDevices();
                    for (let dev of knownDevices) {
                        if (!trackedDevices.some(d => d.id === dev.id)) {
                            registrarYConectarDispositivo(dev);
                        }
                    }
                } catch (e) {
                    addLog("Sin dispositivos previos en memoria.");
                }
            }
        }

        addDeviceBtn.addEventListener('click', () => {
            solicitarNuevoDispositivo();
        });

        async function solicitarNuevoDispositivo() {
            try {
                silentAudio.play().catch(e => console.log(e));
                await requestWakeLock();

                addLog("Buscando dispositivo Bluetooth...");

                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['battery_service', 'device_information', 0x180f, 0x180a]
                });

                if (trackedDevices.some(d => d.id === device.id)) {
                    addLog("El dispositivo ya está en la lista.");
                    return;
                }

                registrarYConectarDispositivo(device);

            } catch (error) {
                addLog(`Búsqueda cancelada o no disponible.`);
            }
        }

        function registrarYConectarDispositivo(device) {
            const item = {
                id: device.id,
                name: device.name || "Dispositivo Bluetooth",
                device: device,
                failedAttempts: 0,
                status: "conectando",
                lastOk: Date.now()
            };

            trackedDevices.push(item);
            saveDeviceToDB({ id: item.id, name: item.name, addedAt: Date.now() });

            device.addEventListener('gattserverdisconnected', () => {
                addLog(`Desconexión: ${item.name}`);
                manejarDesconexionTag(item);
            });

            actualizarListaUI();
            conectarGATT(item);
        }

        async function conectarGATT(item) {
            try {
                addLog(`Conectando con: ${item.name}...`);
                item.status = "conectando";
                actualizarListaUI();

                await item.device.gatt.connect();

                item.failedAttempts = 0;
                item.status = "ok";
                item.lastOk = Date.now();
                addLog(`Conectado a: ${item.name}`);
                
                verificarAlarmaGlobal();
                actualizarListaUI();

            } catch (e) {
                addLog(`Error al conectar con ${item.name}`);
                manejarDesconexionTag(item);
            }
        }

        function iniciarMonitoreoGlobal() {
            if (monitorInterval) clearInterval(monitorInterval);

            monitorInterval = setInterval(async () => {
                for (let item of trackedDevices) {
                    if (item.device && item.device.gatt && item.device.gatt.connected) {
                        try {
                            await item.device.gatt.getPrimaryServices();
                            item.failedAttempts = 0;
                            item.status = "ok";
                            item.lastOk = Date.now();
                        } catch (err) {
                            item.failedAttempts++;
                            addLog(`Micro-corte en ${item.name} (${item.failedAttempts}/3)`);
                            if (item.failedAttempts >= 3) {
                                manejarDesconexionTag(item);
                            }
                        }
                    } else if (item.status !== "perdido") {
                        item.failedAttempts++;
                        if (item.failedAttempts >= 3) {
                            manejarDesconexionTag(item);
                        }
                    }
                }
                actualizarListaUI();
            }, 4000);
        }

        async function manejarDesconexionTag(item) {
            item.status = "reconectando";
            actualizarListaUI();

            let reconectado = false;
            for (let i = 1; i <= 3; i++) {
                addLog(`Reconectando (${item.name}) ${i}/3...`);
                try {
                    if (item.device && item.device.gatt) {
                        await item.device.gatt.connect();
                        reconectado = true;
                        addLog(`Reconectado: ${item.name}`);
                        break;
                    }
                } catch (e) {
                    await new Promise(r => setTimeout(r, 2000));
                }
            }

            if (reconectado) {
                item.failedAttempts = 0;
                item.status = "ok";
                item.lastOk = Date.now();
            } else {
                item.status = "perdido";
                dispararAlarmaTag(item);
            }
            actualizarListaUI();
            verificarAlarmaGlobal();
        }

        function dispararAlarmaTag(item) {
            addLog(`⚠️ ALERTA: ¡${item.name} FUERA DE RANGO!`);

            if (window.CapacitorNative) {
                window.CapacitorNative.triggerHapticFeedback();
                window.CapacitorNative.sendLocalNotification("⚠️ ¡Guardián de Olvidos!", `Se ha perdido la señal de: ${item.name}`);
            } else {
                if (navigator.vibrate) {
                    navigator.vibrate([300, 150, 300, 150, 300]);
                }

                if (Notification.permission === "granted") {
                    navigator.serviceWorker.ready.then(registration => {
                        registration.showNotification("⚠️ ¡Guardián de Olvidos!", {
                            body: `Se ha perdido la señal de: ${item.name}`,
                            icon: "./icon-192.png",
                            tag: `alerta-${item.id}`,
                            requireInteraction: true
                        });
                    });
                }
            }

            ejecutarSonidoAlerta();
        }

        function verificarAlarmaGlobal() {
            const hayPerdidos = trackedDevices.some(d => d.status === "perdido");
            if (hayPerdidos) {
                alarmZone.classList.remove('hidden');
            } else {
                alarmZone.classList.add('hidden');
            }
        }

        window.desvincularTag = function(id) {
            trackedDevices = trackedDevices.filter(d => d.id !== id);
            removeDeviceFromDB(id);
            addLog(`Dispositivo eliminado.`);
            actualizarListaUI();
            verificarAlarmaGlobal();
        };

        window.reconectarTagManual = function(id) {
            const target = trackedDevices.find(d => d.id === id);
            if (target) conectarGATT(target);
        };

        function actualizarListaUI() {
            deviceCount.textContent = `${trackedDevices.length} activo(s)`;

            if (trackedDevices.length === 0) {
                emptyListMsg.classList.remove('hidden');
                deviceList.innerHTML = '';
                deviceList.appendChild(emptyListMsg);
                return;
            }

            emptyListMsg.classList.add('hidden');
            deviceList.innerHTML = '';

            trackedDevices.forEach(item => {
                const card = document.createElement('div');
                card.className = "p-3 rounded-xl bg-gray-900 border border-brandGray flex items-center justify-between";

                let statusBadgeHTML = '';
                if (item.status === 'ok') {
                    statusBadgeHTML = `<span class="text-xs px-2 py-0.5 rounded bg-green-950 text-brandGreen border border-green-800">En Rango</span>`;
                } else if (item.status === 'reconectando' || item.status === 'conectando') {
                    statusBadgeHTML = `<span class="text-xs px-2 py-0.5 rounded bg-orange-950 text-brandOrange border border-orange-800 animate-pulse">Reconectando</span>`;
                } else {
                    statusBadgeHTML = `<span class="text-xs px-2 py-0.5 rounded bg-red-950 text-red-400 border border-red-800 font-bold">PERDIDO</span>`;
                }

                card.innerHTML = `
                    <div class="text-left">
                        <div class="text-sm font-semibold text-gray-200">${item.name}</div>
                        <div class="text-xs text-gray-400 mt-0.5">${statusBadgeHTML}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="window.reconectarTagManual('${item.id}')" class="text-xs bg-brandGray hover:bg-gray-600 px-2 py-1 rounded text-white">Reconectar</button>
                        <button onclick="window.desvincularTag('${item.id}')" class="text-xs bg-red-950 hover:bg-red-900 text-red-400 px-2 py-1 rounded border border-red-800">🗑️</button>
                    </div>
                `;
                deviceList.appendChild(card);
            });
        }

        function ejecutarSonidoAlerta() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 2.0);
            } catch (e) {
                console.log(e);
            }
        }
    </script>
</body>
</html>
